[package]
name = "bperf-storage"
version = "0.1.1"
edition = "2024"
description = "Crash-safe local persistence primitives for bperf"
license = "MIT"
repository = "https://github.com/itsjamie/bperf"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.27"
