[package]
name = "bperf-browser"
version = "0.1.0"
edition = "2024"
description = "Cross-engine browser capture for bperf"
license = "MIT"
repository = "https://github.com/itsjamie/bperf"

[dependencies]
anyhow = "1.0"
bperf-runtime = { path = "../bperf-runtime" }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
