name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint every Rust target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the Rust workspace
        run: cargo test --workspace --locked

  registry-contract:
    name: Authenticated Playwright registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce the embedded registry from the signed npm package
        run: cargo run --locked -p bperf-build -- playwright-registry check

  engine-contract:
    name: ${{ matrix.engine }} / ${{ matrix.os }}
    needs:
      - fast
      - registry-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        engine:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ${{ matrix.engine }} and Linux dependencies
        if: runner.os == 'Linux'
        run: cargo run --locked -- browsers install --with-deps --engine ${{ matrix.engine }}
      - name: Install ${{ matrix.engine }}
        if: runner.os != 'Linux'
        run: cargo run --locked -- browsers install --engine ${{ matrix.engine }}
      - name: Prove the ${{ matrix.engine }} capture contract
        run: cargo run --locked -- doctor --engine ${{ matrix.engine }} --artifact-dir .bperf/ci-doctor
      - name: Prove retained-lane recovery
        run: cargo test --locked -p bperf-browser ${{ matrix.engine }}::tests::browser_lab_uses_fresh_contexts_and_recovers_after_failure -- --ignored --exact
      - name: Capture dedicated-worker and iframe evidence
        run: cargo test --locked -p bperf-browser --test child_realms ${{ matrix.engine }}_dedicated_workers_and_iframes_contribute_native_evidence -- --ignored --exact
      - name: Upload doctor evidence after failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: doctor-${{ matrix.engine }}-${{ matrix.os }}
          path: .bperf
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  cross-engine-contract:
    name: Cross-engine contract / ubuntu
    needs:
      - fast
      - registry-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install all browsers and Linux dependencies
        run: cargo run --locked -- browsers install --with-deps --engine all
      - name: Prove all-engine doctor orchestration
        run: cargo run --locked -- doctor --engine all --artifact-dir .bperf/ci-doctor-all
      - name: Check the complete capture summary
        run: cargo test --locked --test browser_contract every_engine_satisfies_the_capture_contract -- --ignored --exact
      - name: Check retained process containment
        run: cargo test --locked -p bperf-browser lab::tests::retained_lanes_keep_one_root_pid_and_shutdown_all_contained_processes -- --ignored --exact
      - name: Measure and compare both variants
        run: cargo test --locked --test measurement_contract variants_can_be_measured_and_compared_on_every_engine -- --ignored --exact
      - name: Run the managed TypeScript benchmark contract
        run: cargo test --locked managed_benchmark::tests::managed_benchmark_satisfies_every_engine_contract -- --ignored --exact
      - name: Upload doctor evidence after failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: doctor-all-ubuntu
          path: .bperf
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package-contract:
    name: Package / ${{ matrix.target }}
    needs:
      - fast
      - registry-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and Cargo-install the release package
        env:
          BPERF_INSTALL_ROOT: ${{ runner.temp }}/bperf-cargo
          BPERF_RELEASE_TARGET: ${{ matrix.target }}
        run: cargo run --locked -p bperf-build -- package --install
      - name: Prove the installed all-engine and managed benchmark contracts
        env:
          BPERF_TEST_CARGO_HOME: ${{ runner.temp }}/bperf-cargo
          BPERF_TEST_ROOT: ${{ runner.temp }}/bperf-package-test
        run: cargo run --locked -p bperf-build -- verify-install release
      - name: Install from source through Cargo
        run: cargo install --path . --locked --root "${{ runner.temp }}/bperf-source-cargo"
      - name: Prove the Cargo source installation
        env:
          BPERF_TEST_CARGO_HOME: ${{ runner.temp }}/bperf-source-cargo
          BPERF_TEST_ROOT: ${{ runner.temp }}/bperf-source-cargo-test
        run: cargo run --locked -p bperf-build -- verify-install source
      - name: Upload the tagged release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/bperf-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload package evidence after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-failure-${{ matrix.target }}
          path: |
            .bperf
            ${{ runner.temp }}/bperf-package-test
            ${{ runner.temp }}/bperf-source-cargo-test
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - engine-contract
      - cross-engine-contract
      - package-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write release checksums
        working-directory: dist
        run: sha256sum *.tar.gz | sort > SHA256SUMS
      - name: Publish the tagged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "bperf ${{ github.ref_name }}"
