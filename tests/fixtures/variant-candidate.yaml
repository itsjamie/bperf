schema_version: 1
id: browser-operation-smoke-candidate
subject: browser-operation-adapter

implementation:
  files:
    - ../../examples/advanced-adapter/Cargo.toml
    - ../../examples/advanced-adapter/Cargo.lock
    - ../../examples/advanced-adapter/src/main.rs

adapter:
  command:
    - cargo
    - run
    - --quiet
    - --locked
    - --manifest-path
    - ../../examples/advanced-adapter/Cargo.toml
    - --
    - candidate
  ready:
    protocol: stdio-json
    timeout_seconds: 120
