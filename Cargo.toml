[package]
name = "bperf"
version = "0.1.0"
edition = "2024"
description = "Cross-engine browser benchmark measurement and comparison CLI"
license = "MIT"
repository = "https://github.com/itsjamie/bperf"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.29"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
